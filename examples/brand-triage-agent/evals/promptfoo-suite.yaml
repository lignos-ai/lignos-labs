# Generated from .lignos/intent-standard.json by scripts/export-evals.ts.
# Re-run with: npm run evals:export
description: "Autonomous Brand Deal Triage Agent — brand-deal-triage"
prompts:
  - |
    You are the Autonomous Brand Deal Triage Agent.
    This agent is hired to turn an inbound brand pitch into a sendable counter that already matches the rate card — and must always hold a $2,500 minimum and refuse category exclusivity under $5,000.
    
    Job: A creator partnerships lead opens an inbound brand pitch and needs a sendable counter before any contract, rate, or reply goes out.
    User: Creator partnerships lead triaging the inbound sponsorship inbox
    Outcome: A counter whose rate and exclusivity decision can be sent as-is on a low-risk pitch, and a hard stop when exclusivity or the dollar amount raises the blast radius
    
    Product standard: The counter reads like the partnerships lead already checked the rate card: $2,500 floor, $1,000 whitelisting adder, no category exclusivity under $5,000.
    Tone: Direct and commercial, with no hedging and no complimentary exceptions
    Format: Raw JSON with offeredBudgetUsd (integer or null), counterRateUsd (integer), whitelistingApproved (boolean), exclusivityAccepted (boolean), and reasoning (string). No markdown.
    Rules:
    - Production floor is $2,500. counterRateUsd is the maximum of the offered budget and the floor.
    - Paid whitelisting or amplification adds $1,000 to the floor before that maximum is taken, and whitelistingApproved is true only when the pitch asks for it.
    - Category exclusivity is accepted only when the offered budget is at least $5,000. Otherwise exclusivityAccepted is false.
    - If exclusivity is not requested, exclusivityAccepted is true.
    - If the pitch does not state a budget, offeredBudgetUsd is null and the offered amount used in the maximum is 0. Never invent a number.
    
    Never: Quoting the brand's number back when it sits under the floor, or accepting category exclusivity on a deal under $5,000 because the email sounded friendly.
    - we can make an exception on exclusivity
    - happy to lock exclusivity
    - complimentary
    - as a gesture
    - meet you at your budget
    
    Respond with raw JSON only.
    
    Inbound pitch:
    """
    {{pitch_text}}
    """
providers:
  - id: openai:chat:gpt-4o-mini
    config:
      temperature: 0.0
      response_format:
        type: json_object
tests:
  - description: "lowball-exclusivity-whitelist"
    vars:
      pitch_text: |
        Hi! We love your work. We have a $1,200 budget for 1 Reel and 3 Stories.
        We also need 30 days of paid whitelisting and 60 days of skincare exclusivity.
    assert:
      - type: is-json
      - type: not-contains
        value: "we can make an exception on exclusivity"
      - type: not-contains
        value: "happy to lock exclusivity"
      - type: not-contains
        value: "complimentary"
      - type: not-contains
        value: "as a gesture"
      - type: not-contains
        value: "meet you at your budget"
      - type: javascript
        value: "JSON.parse(output).offeredBudgetUsd === 1200 && JSON.parse(output).counterRateUsd === 3500 && JSON.parse(output).whitelistingApproved === true && JSON.parse(output).exclusivityAccepted === false"
      - type: llm-rubric
        provider: openai:gpt-4o-mini
        value: |
          You are evaluating a brand deal triage counter against this product standard.
          
          Standard: $2,500 production floor, plus $1,000 when whitelisting is requested. Counter is the max of the offered budget and that floor. Category exclusivity is accepted only when the offered budget is at least $5,000. Unstated budgets stay null.
          Anti-pattern: meeting the brand under the floor, or accepting exclusivity under $5,000.
          Value signal: a partnerships lead can send the counter unchanged, and low-risk deals support a straight-through rate of at least 75%.
          
          Score the output against the rate card. A friendly email that breaks a floor is a FAIL.
          
          Expected: Counter at the $3,500 floor ($2,500 plus $1,000 whitelisting) and decline exclusivity because $1,200 is under $5,000.
          Failure mode: Accepting exclusivity or countering at $1,200 because the brand named that budget.
          Judge question: Would a partnerships lead send this counter without changing the rate or the exclusivity decision, and would a week of pitches like this hold a straight-through rate of at least 75%?
          
          Blocking rules:
          - counterRateUsd is always at least 2500
          - exclusivityAccepted is false whenever the offered budget is under 5000
          - offeredBudgetUsd is null when the pitch states no budget
          - Do not use the phrase: we can make an exception on exclusivity
          - Do not use the phrase: happy to lock exclusivity

